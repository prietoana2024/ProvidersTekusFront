<div class="p-3">
  <h2 class="text-center mb-3">Registro de Usuario</h2>

  <form [formGroup]="formularioRegister" (ngSubmit)="registrar()" class="d-flex flex-column gap-3">

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" class="form-control" placeholder="Tu nombre">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" class="form-control" placeholder="correo@ejemplo.com">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password" class="form-control" placeholder="********">
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-secondary" (click)="cerrar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="formularioRegister.invalid || loading">
        Registrar
      </button>
    </div>
  </form>
</div>
