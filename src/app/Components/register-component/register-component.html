<div class="register-container">
  <mat-card class="register-card">
    <mat-card-title class="text-center">Crear Cuenta</mat-card-title>
    <mat-card-content>
      <form [formGroup]="formularioRegistro" (ngSubmit)="registrar()">

        <!-- Nombre -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput placeholder="Nombre completo" formControlName="nombre">
          <mat-error *ngIf="formularioRegistro.get('nombre')?.hasError('required')">
            El nombre es requerido
          </mat-error>
          <mat-error *ngIf="formularioRegistro.get('nombre')?.hasError('minlength')">
            Mínimo 3 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput placeholder="Correo electrónico" formControlName="email">
          <mat-error *ngIf="formularioRegistro.get('email')?.hasError('required')">
            El email es requerido
          </mat-error>
          <mat-error *ngIf="formularioRegistro.get('email')?.hasError('email')">
            Email inválido
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" placeholder="Contraseña">
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
            <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="formularioRegistro.get('password')?.hasError('required')">
            La contraseña es requerida
          </mat-error>
          <mat-error *ngIf="formularioRegistro.get('password')?.hasError('minlength')">
            Mínimo 6 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Confirm Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar Contraseña</mat-label>
          <input matInput [type]="ocultarConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Confirmar contraseña">
          <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPasswordVisibility()">
            <mat-icon>{{ ocultarConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="formularioRegistro.get('confirmPassword')?.hasError('required')">
            La confirmación es requerida
          </mat-error>
          <mat-error *ngIf="formularioRegistro.hasError('passwordMismatch')">
            Las contraseñas no coinciden
          </mat-error>
        </mat-form-field>

        <!-- Botón Registrar -->
        <button mat-raised-button color="primary" class="full-width" [disabled]="mostrarLoading">
          <mat-progress-bar *ngIf="mostrarLoading" mode="indeterminate" color="accent"></mat-progress-bar>
          Registrarse
        </button>

      </form>
    </mat-card-content>

    <!-- Link a Login -->
    <mat-card-actions class="text-center">
      <span>¿Ya tienes cuenta?</span>
      <button mat-button color="accent" type="button" (click)="irALogin()">Iniciar sesión</button>
    </mat-card-actions>
  </mat-card>
</div>
