<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow-lg" style="width: 450px; text-align: center;">
    <h2 class="mb-4">Iniciar Sesión</h2>

    <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()"
          class="d-flex flex-column align-items-stretch gap-3">

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="correo@ejemplo.com">
        <mat-icon matPrefix>mail</mat-icon>
        <mat-error *ngIf="formularioLogin.get('email')?.hasError('required')">
          El email es requerido
        </mat-error>
        <mat-error *ngIf="formularioLogin.get('email')?.hasError('email')">
          Email inválido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" placeholder="Contraseña">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
          <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="formularioLogin.get('password')?.hasError('required')">
          La contraseña es requerida
        </mat-error>
        <mat-error *ngIf="formularioLogin.get('password')?.hasError('minlength')">
          Mínimo 6 caracteres
        </mat-error>
      </mat-form-field>

      <button type="submit" class="btn btn-primary w-100"
              [disabled]="formularioLogin.invalid || mostrarLoading">
        <i class="bi bi-box-arrow-in-right"></i> Ingresar
      </button>
    </form>

    <!-- 🟢 NUEVO: Botón para abrir modal de registro -->
    <div class="mt-4">
      <span>¿Desea registrarse? </span>
      <button  type="button"  matButton="filled" (click)="abrirModalRegistro()">Click aquí</button>
    </div>
  </div>
</div>
